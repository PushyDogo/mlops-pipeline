[project]
name = "mlops-taxi-tip"
version = "0.1.0"
description = "Interview-oriented MLOps pipeline for NYC taxi tip prediction."
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "dvc>=3.67.1",
    "lightgbm>=4.6.0",
    "mlflow==3.12.0",
    "pandas>=2.3,<3",
    "protobuf>=4.25,<5",
    "pyarrow>=23,<24",
    "scikit-learn>=1.8.0",
    "setuptools>=80,<81",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
